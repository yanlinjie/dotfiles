# 从 1 开始编号
set -g base-index 1
setw -g pane-base-index 1

# 开启鼠标支持：滚动、选择分屏、调整分屏大小
set -g mouse on

# 支持更丰富的终端颜色
set -g default-terminal "tmux-256color"

# 增加历史记录行数
set -g history-limit 10000

# 使用 Vi 风格的复制模式
setw -g mode-keys vi


# 关闭窗口后，自动重新整理窗口编号
set -g renumber-windows on

# 新窗口和分屏继承当前面板的工作目录
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# 减少 Esc 键的响应延迟（对 Vim/Neovim 更友好）
set -sg escape-time 10

# 快捷重载配置：Ctrl+b 后按 r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# 状态栏显示会话名、主机名和时间
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#S '
set -g status-right '#H %Y-%m-%d %H:%M'

# Ctrl+b 后使用 h/j/k/l 切换分屏
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl+b 后使用大写 H/J/K/L 调整分屏大小
# 每次调整 5 格，支持连续操作
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Neovim 与 tmux 统一分屏导航
run-shell 'bash ~/.local/share/nvim/site/pack/project-tools/opt/vim-tmux-navigator/vim-tmux-navigator.tmux'

#非活动窗口：灰色
set -g pane-border-style 'fg=colour240'

# 活动窗格：亮蓝色
set -g pane-active-border-style 'fg=colour39'

# 使用较粗的边框线
set -g pane-border-lines heavy

# 顶部显示窗格编号和当前程序
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{pane_current_command} '

# | 表示左右分屏，- 表示上下分屏
# 新窗格继承当前目录
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}" 
